# Contrat de sandboxd — squelette du TP3.
# Une opération est écrite pour exemple (getSandbox). À vous d'écrire les autres :
# voir le sujet du TP, partie 1. Vérifiez avec `make lint` après chaque ajout.
openapi: 3.1.0
info:
  title: sandboxd
  version: 1.0.0
  summary: Des sandboxes éphémères à la demande, pilotées par HTTP.
  description: |
    sandboxd crée, pilote et détruit des sandboxes : des conteneurs Docker
    isolés et jetables, dans lesquels un opérateur ou un agent exécute des
    commandes et lit ou écrit des fichiers.
    Toutes les erreurs suivent la RFC 9457 (application/problem+json).
    400 : JSON illisible. 422 : requête lisible mais valeur invalide.
  contact:
    name: "Binôme : ROMOLI Enzo / LETELLIER Elsa"
servers:
  - url: http://localhost:8000
    description: Développement local
tags:
  - name: sandboxes
    description: Cycle de vie des sandboxes
  - name: exec
    description: Exécution de commandes
  - name: files
    description: Lecture et écriture de fichiers
  - name: health
    description: Sondes de santé

paths:
  /v1/sandboxes:
    post:
      tags: [sandboxes]
      operationId: createSandbox
      summary: Créer une sandbox
      description: |
        Enregistre la sandbox en état pending et lance sa création en tâche
        de fond. Rejouer la requête avec le même Idempotency-Key renvoie la
        même sandbox.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Clé choisie par le client pour rendre la création rejouable.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxCreate"
      responses:
        "202":
          description: Sandbox acceptée, en état pending.
          headers:
            Location:
              description: URL de la sandbox créée.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    get:
      tags: [sandboxes]
      operationId: listSandboxes
      summary: Lister les sandboxes
      description: Renvoie les sandboxes page par page, éventuellement filtrées par état.
      parameters:
        - name: status
          in: query
          required: false
          description: Ne renvoie que les sandboxes dans cet état.
          schema:
            $ref: "#/components/schemas/SandboxStatus"
        - name: page_size
          in: query
          required: false
          description: Nombre maximal de sandboxes par page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page_token
          in: query
          required: false
          description: Jeton de la page suivante, renvoyé par la page précédente.
          schema:
            type: string
      responses:
        "200":
          description: Une page de sandboxes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /v1/sandboxes/{sandbox_id}:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    get:
      tags: [sandboxes]
      operationId: getSandbox
      summary: Consulter une sandbox
      description: Renvoie l'état courant de la sandbox.
      responses:
        "200":
          description: La sandbox.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [sandboxes]
      operationId: updateSandbox
      summary: Modifier une sandbox
      description: |
        Applique un JSON Merge Patch (RFC 7396) : seul ttl_seconds est
        modifiable, ce qui prolonge ou raccourcit la durée de vie à partir de
        created_at. Avec If-Match, la modification n'a lieu que si l'ETag
        correspond encore à la version courante.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: ETag de la version lue ; refusée si la sandbox a changé depuis.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SandboxPatch"
      responses:
        "200":
          description: La sandbox modifiée.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    delete:
      tags: [sandboxes]
      operationId: deleteSandbox
      summary: Détruire une sandbox
      description: |
        Supprime le conteneur et oublie la sandbox : une lecture ultérieure
        renvoie 404. Une sandbox encore en pending est détruite dès que sa
        création se termine.
      responses:
        "204":
          description: Sandbox détruite.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/sandboxes/{sandbox_id}/exec:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    post:
      tags: [exec]
      operationId: execCommand
      summary: Exécuter une commande
      description: |
        Lance la commande dans /workspace et attend sa fin, sans shell :
        cmd est passé tel quel. Au-delà de timeout_seconds, la commande est
        tuée et timed_out vaut true. Chaque flux est tronqué à 1 Mio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: La commande s'est terminée (quel que soit son code de sortie).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /v1/sandboxes/{sandbox_id}/files:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
      - $ref: "#/components/parameters/FilePath"
    get:
      tags: [files]
      operationId: readFile
      summary: Lire un fichier
      description: Renvoie le contenu brut du fichier.
      responses:
        "200":
          description: Le contenu du fichier.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    put:
      tags: [files]
      operationId: writeFile
      summary: Écrire un fichier
      description: Crée le fichier ou remplace son contenu (1 Mio au plus).
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Fichier créé.
        "204":
          description: Fichier remplacé.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Le processus est-il vivant ?
      description: Ne vérifie aucune dépendance.
      responses:
        "200":
          description: Vivant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok]}

components:
  headers:
    ETag:
      description: Version courante de la sandbox, à renvoyer dans If-Match.
      schema:
        type: string

  parameters:
    SandboxId:
      name: sandbox_id
      in: path
      required: true
      description: Identifiant de la sandbox.
      schema:
        type: string
        pattern: "^sbx-[a-z0-9]{8}$"
      example: sbx-a1b2c3d4
    FilePath:
      name: path
      in: query
      required: true
      description: Chemin du fichier, relatif à /workspace.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: '^[^/\x00][^\x00]*$'
        not:
          pattern: '(^|/)\.\.(/|$)'
      example: src/main.py

  schemas:
    SandboxStatus:
      type: string
      enum: [pending, ready, failed, terminated]
      example: pending
    Image:
      type: string
      description: Images autorisées (liste blanche).
      enum: [python:3.12-slim, node:22-slim, alpine:3.20]
      example: python:3.12-slim
    Limits:
      type: object
      additionalProperties: false
      properties:
        cpus:
          type: number
          minimum: 0.1
          maximum: 2
          default: 1
          example: 1
        memory_mb:
          type: integer
          minimum: 64
          maximum: 1024
          default: 512
          example: 256
    Sandbox:
      type: object
      required: [id, image, status, ttl_seconds, limits, created_at, expires_at]
      properties:
        id:
          type: string
          pattern: "^sbx-[a-z0-9]{8}$"
          example: sbx-a1b2c3d4
        image:
          $ref: "#/components/schemas/Image"
        status:
          $ref: "#/components/schemas/SandboxStatus"
        ttl_seconds:
          type: integer
          example: 600
        limits:
          $ref: "#/components/schemas/Limits"
        created_at:
          type: string
          format: date-time
          example: "2026-10-28T14:00:00Z"
        expires_at:
          type: string
          format: date-time
          example: "2026-10-28T14:10:00Z"
    SandboxCreate:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          $ref: "#/components/schemas/Image"
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 600
          example: 600
        limits:
          $ref: "#/components/schemas/Limits"
    SandboxList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Sandbox"
        next_page_token:
          type: [string, "null"]
          description: Jeton de la page suivante, null s'il n'y en a plus.
          example: fauxJetondelaPageSuivante
    SandboxPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          example: 800
    ExecRequest:
      type: object
      additionalProperties: false
      required: [cmd]
      properties:
        cmd:
          type: array
          description: Programme puis arguments, sans interprétation par un shell.
          minItems: 1
          items:
            type: string
            minLength: 1
          example: [python, -c, "print(2 + 2)"]
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 30
          example: 40
    ExecResult:
      type: object
      required: [exit_code, stdout, stderr, duration_ms, timed_out, truncated]
      properties:
        exit_code:
          type: [integer, "null"]
          description: Code de sortie, null si la commande a été tuée par le délai.
          example: 0
        stdout:
          type: string
          example: "4\n"
        stderr:
          type: string
          example: ""
        duration_ms:
          type: integer
          minimum: 0
          example: 42
        timed_out:
          type: boolean
          example: false
        truncated:
          type: boolean
          description: Vrai si stdout ou stderr dépassait 1 Mio.
          example: false
    Problem:
      type: object
      description: RFC 9457, Problem Details for HTTP APIs.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          enum: [/problems/not-found, /problems/file-not-found, /problems/not-ready, /problems/idempotency-conflict, /problems/invalid-json, /problems/validation, /problems/precondition-failed, /problems/unsupported-media-type, /problems/payload-too-large]
          example: /problems/not-found
        title:
          type: string
          example: Sandbox introuvable
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: sbx-a1b2c3d4 n'existe pas
        instance:
          type: string
          example: /v1/sandboxes/sbx-a1b2c3d4

  responses:
    NotFound:
      description: Sandbox introuvable.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    BadRequest:
      description: Requête mal formée.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    UnsupportedMediaType:
      description: Content-Type non pris en charge.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: Idempotency-Key déjà utilisée avec un corps différent.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    UnprocessableContent:
      description: Contenu invalide.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    PreconditionFailed:
      description: If-Match ne correspond plus à la version courante.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotReady:
      description: La sandbox n'est pas en état ready.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    PayloadTooLarge:
      description: Corps trop volumineux.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
